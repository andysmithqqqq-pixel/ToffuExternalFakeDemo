name: Extract ZIP

on:
  push:
    paths:
      - "*.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract archive
        run: |
          ZIP=$(find . -maxdepth 1 -name '*.zip' | head -n1)
          if [ -z "$ZIP" ]; then exit 0; fi
          mkdir /tmp/project
          unzip -q "$ZIP" -d /tmp/project
          SRC=/tmp/project
          COUNT=$(find /tmp/project -mindepth 1 -maxdepth 1 | wc -l)
          if [ "$COUNT" -eq 1 ] && [ -d "$(find /tmp/project -mindepth 1 -maxdepth 1)" ]; then
            SRC=$(find /tmp/project -mindepth 1 -maxdepth 1 -type d)
          fi
          cp -a "$SRC"/. .
          rm -f "$ZIP"
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Extract project and remove ZIP"
          git push
